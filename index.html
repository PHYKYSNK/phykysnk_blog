<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习日志</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="#/" class="site-title">学习日志</a>
    <nav class="site-nav">
      <a href="#/" class="nav-link">首页</a>
      <a href="#/changelog" class="nav-link">更新日志</a>
      <a href="#/about" class="nav-link">关于</a>
    </nav>
    <button id="theme-toggle" class="theme-btn" aria-label="切换暗色模式">
      <span class="icon-sun">☀️</span>
      <span class="icon-moon">🌙</span>
    </button>
  </div>
</header>

<main class="container">
  <section id="home-view">
    <div class="home-header">
      <h1 class="home-title">学习日志</h1>
      <p class="home-subtitle">记录每一步成长</p>
      <div class="search-wrap">
        <input type="search" id="search-input" placeholder="搜索文章..." aria-label="搜索文章">
      </div>
      <div id="tag-filter" class="tag-filter"></div>
    </div>
    <div id="post-list" class="post-list"></div>
  </section>
  <article id="post-view" class="hidden">
    <a href="#/" class="back-link">&larr; 返回</a>
    <div class="post-layout">
      <aside id="post-toc" class="post-toc collapsed">
        <button id="toc-toggle" class="toc-toggle-btn" aria-label="展开目录">📖</button>
        <div class="toc-sidebar-inner">
          <div class="toc-sidebar-header">
            <span class="toc-sidebar-title">目录</span>
          </div>
          <nav id="toc-nav" class="toc-nav"></nav>
        </div>
      </aside>
      <div id="post-content" class="post-content"></div>
    </div>
  </article>
  <article id="about-view" class="hidden">
    <a href="#/" class="back-link">&larr; 返回</a>
    <div id="about-content" class="post-content"></div>
  </article>
  <section id="changelog-view" class="hidden">
    <a href="#/" class="back-link">&larr; 返回</a>
    <div class="changelog-header">
      <h1 class="home-title">更新日志</h1>
      <p class="home-subtitle">博客的每一次变化，都记录在这里</p>
    </div>
    <div id="changelog-list" class="changelog-list"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; 2026 · 学习日志 · 用 Markdown 写作 · 托管在 Cloudflare Pages</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme-link">
<script src="scripts/main.js"></script>
</body>
</html>
